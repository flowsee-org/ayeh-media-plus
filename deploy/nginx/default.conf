# Ayeh Media Plus — reverse proxy (single-instance)
# Public entry → routes API/uploads/socket.io to Express, everything else to Next.
#
# Upstream names match docker-compose service names on the private app network.

upstream ayeh_api {
    server api:5000;
    keepalive 32;
}

upstream ayeh_web {
    server web:5173;
    keepalive 32;
}

# Map WebSocket upgrade for Socket.IO
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Multer allows 100MB media uploads; leave headroom for multipart overhead.
    client_max_body_size 110m;

    # Reasonable defaults for large media + long-lived sockets
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # ── Express API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://ayeh_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # ── Uploaded media (Express static from repo-root /uploads) ───────────────
    location /uploads/ {
        proxy_pass http://ayeh_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Cache hints for immutable-ish hashed filenames (operator CDN optional later)
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ── Socket.IO (HTTP long-poll + WebSocket upgrade) ───────────────────────
    location /socket.io/ {
        proxy_pass http://ayeh_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Next.js frontend (all other paths) ───────────────────────────────────
    location / {
        proxy_pass http://ayeh_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
